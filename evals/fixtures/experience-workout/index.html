<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cedar</title>
<link rel="stylesheet" href="style.css">
<main>
<header class="row">
<h1>Active workout</h1>
<button class="primary" id="finish">Finish workout</button>
</header>
<section id="guidance">
<h2>Session guidance</h2>
<p>Optional planning context and earlier-session suggestions.</p>
<button>Refresh guidance</button>
<button>Training history</button>
<p>Review recent patterns before choosing your next activity.</p>
</section>
<section id="active">
<h2>Current exercise: squat</h2>
<p>Rest: 45 seconds remaining</p>
<p>Set 2 of 3</p>
<label for="reps">Reps</label>
<input id="reps" value="8">
<button id="log">Log set</button>
</section>
</main>
<script src="app.js">
</script>
</html>
